name: Feature request
description: Suggest a focused improvement to Memo Flow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Local-first expectations
      options:
        - label: The proposal can keep Markdown as the authoritative data source.
          required: true

